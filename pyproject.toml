[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmwiki-harness"
version = "0.2.2"
description = "Context-Memory Harness for AI Agents. Context Window = RAM, Local Wiki = Disk."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "chancelu"},
]
keywords = [
    "agent", "memory", "wiki", "markdown", "obsidian",
    "llm", "context", "retrieval", "rag", "karpathy"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/chancelu/llmwiki-harness"
Issues = "https://github.com/chancelu/llmwiki-harness/issues"

[project.scripts]
llmwiki = "llmwiki.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "ruff"]
semantic = ["sentence-transformers", "numpy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llmwiki*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
